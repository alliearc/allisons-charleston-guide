<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173f3a" />
  <title>Allison's Charleston Guide</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root {
      --ink:#19352f; --green:#173f3a; --sage:#dfe9e4; --cream:#fbf7ef;
      --gold:#a87d2c; --rose:#a35d58; --coffee:#7d5a43; --line:#ded9ce;
      --card:#ffffff; --muted:#6c746f;
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding:28px 18px 18px; background:linear-gradient(135deg,#173f3a,#315e56); color:white; }
    .header-inner { max-width:1180px; margin:auto; }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(2rem,6vw,3.8rem); font-weight:500; letter-spacing:-.03em; }
    .subtitle { margin:.45rem 0 0; opacity:.92; }
    .countline { margin-top:14px; font-size:.92rem; opacity:.88; }
    main { max-width:1180px; margin:auto; padding:16px; }
    .toolbar { display:grid; gap:10px; margin-bottom:14px; position:sticky; top:0; z-index:900; padding:10px 0; background:rgba(251,247,239,.95); backdrop-filter:blur(8px); }
    .search { width:100%; padding:13px 15px; border:1px solid var(--line); border-radius:14px; font-size:1rem; background:white; box-shadow:0 4px 18px rgba(20,40,35,.05); }
    .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
    .chip { border:1px solid var(--line); background:white; color:var(--ink); padding:9px 12px; border-radius:999px; white-space:nowrap; font-weight:650; cursor:pointer; }
    .chip.active { background:var(--green); color:white; border-color:var(--green); }
    #map { height:48vh; min-height:360px; border-radius:18px; border:1px solid var(--line); box-shadow:0 10px 30px rgba(20,40,35,.08); overflow:hidden; }
    .summary { display:flex; justify-content:space-between; gap:10px; align-items:center; margin:18px 2px 10px; }
    .summary h2 { font-family:Georgia,serif; font-weight:500; margin:0; font-size:1.65rem; }
    #visibleCount { color:var(--muted); font-size:.92rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; box-shadow:0 7px 22px rgba(20,40,35,.055); }
    .card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .card h3 { margin:0; font-size:1.1rem; }
    .type { font-size:.73rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; padding:5px 8px; white-space:nowrap; }
    .restaurant .type { background:#e4eee9; color:#23534b; }
    .dessert .type { background:#f6e6e4; color:#884a46; }
    .coffee .type { background:#eee5dd; color:#6a4a36; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 6px; }
    .badge { font-size:.78rem; border-radius:999px; padding:5px 8px; background:#f4f2ec; border:1px solid #e7e1d7; }
    .planned { background:#eef0fa; color:#4a5687; }
    .skip { background:#f8e8e7; color:#883c38; }
    .meta { margin-top:7px; color:#47534f; font-size:.91rem; line-height:1.4; }
    .label { color:var(--muted); font-weight:700; }
    .rating { letter-spacing:.05em; }
    .must { margin-top:10px; background:#fff8e6; border-left:4px solid var(--gold); padding:9px 10px; border-radius:7px; font-size:.9rem; }
    .actions { display:flex; gap:8px; margin-top:13px; }
    .btn { display:inline-flex; text-decoration:none; align-items:center; justify-content:center; flex:1; border-radius:10px; padding:9px 10px; font-weight:750; font-size:.88rem; }
    .btn.primary { background:var(--green); color:white; }
    .btn.secondary { color:var(--green); border:1px solid #b9c9c4; background:white; }
    footer { max-width:1180px; margin:25px auto 0; padding:22px 18px 34px; color:var(--muted); font-size:.84rem; text-align:center; }
    .leaflet-popup-content-wrapper { border-radius:14px; }
    .popup-name { font-weight:800; font-size:1rem; margin-bottom:4px; }
    @media (min-width:900px) {
      .toolbar { grid-template-columns:minmax(280px,1fr) 2fr; align-items:center; }
      #map { height:520px; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Allison's Charleston Guide</h1>
    <p class="subtitle">Restaurants, sweet stops, and coffee—curated for Charleston trips.</p>
    <div class="countline">32 restaurants · 9 bakeries & dessert places · 17 coffee shops</div>
  </div>
</header>

<main>
  <section class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search by name, neighborhood, cuisine, or note…" />
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="restaurant">🍽 Restaurants</button>
      <button class="chip" data-filter="dessert">🍰 Dessert</button>
      <button class="chip" data-filter="coffee">☕ Coffee</button>
      <button class="chip" data-filter="favorite">⭐ Favorites</button>
      <button class="chip" data-filter="planned">📅 Planned</button>
      <button class="chip" data-filter="visited">✅ Been There</button>
      <button class="chip" data-filter="returnSoon">🔁 Return Soon</button>
    </div>
  </section>

  <div id="map"></div>
  <div id="mapStatus" style="margin:8px 2px 0;color:#6c746f;font-size:.88rem">Loading map pins…</div>

  <div class="summary">
    <h2>Places</h2>
    <div id="visibleCount"></div>
  </div>
  <section id="cards" class="grid"></section>
</main>

<footer>Updated August 2026 · Your public link stays the same whenever this file is replaced on GitHub.</footer>

.7281,-80.0615]};
places.forEach((p,i)=>p._id=i);
let activeFilter = "all";
let query = "";
const markers = [];
const markerByName = new Map();

const map = L.map('map', {scrollWheelZoom:false}).setView([32.7876,-79.9403], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

function pinIcon(category) {
  const bg = category === "restaurant" ? "#173f3a" : category === "dessert" ? "#a35d58" : "#7d5a43";
  return L.divIcon({
    className:"",
    html:`<div style="width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${bg};border:2px solid white;box-shadow:0 2px 7px #0004;display:grid;place-items:center"><span style="transform:rotate(45deg);font-size:15px">${categoryIcons[category]}</span></div>`,
    iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-31]
  });
}

function matches(p) {
  const blob = [p.name,p.address,p.locale,p.hood,p.hours,p.specialties,p.status,p.rating,p.mustOrder].join(" ").toLowerCase();
  const textOK = !query || blob.includes(query);
  let filterOK = true;
  if (["restaurant","dessert","coffee"].includes(activeFilter)) filterOK = p.category === activeFilter;
  else if (activeFilter === "favorite") filterOK = p.favorite;
  else if (activeFilter === "planned") filterOK = p.planned;
  else if (activeFilter === "visited") filterOK = p.visited;
  else if (activeFilter === "returnSoon") filterOK = p.returnSoon;
  return textOK && filterOK;
}

function badges(p) {
  const b = [];
  if (p.favorite) b.push('<span class="badge">⭐ Favorite</span>');
  if (p.returnSoon) b.push('<span class="badge">🔁 Return Soon</span>');
  if (p.visited) b.push('<span class="badge">✅ Been There</span>');
  if (p.skip) b.push('<span class="badge skip">🚫 Don’t Need to Return</span>');
  if (p.planned) b.push(`<span class="badge planned">📅 ${escapeHTML(p.status)}</span>`);
  return b.join("");
}

function escapeHTML(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function cardHTML(p) {
  const directions = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.name,p.address,p.locale,"SC"].filter(Boolean).join(", "))}`;
  return `<article class="card ${p.category}">
    <div class="card-top">
      <h3>${escapeHTML(p.name)}</h3>
      <span class="type">${categoryNames[p.category]}</span>
    </div>
    <div class="badges">${badges(p)}</div>
    ${p.rating ? `<div class="meta rating"><span class="label">Allison rating:</span> ${escapeHTML(p.rating)}</div>` : ""}
    <div class="meta"><span class="label">Where:</span> ${escapeHTML([p.address,p.hood,p.locale].filter(Boolean).join(" · "))}</div>
    ${p.hours ? `<div class="meta"><span class="label">Hours:</span> ${escapeHTML(p.hours)}</div>` : ""}
    ${p.specialties ? `<div class="meta"><span class="label">Known for:</span> ${escapeHTML(p.specialties)}</div>` : ""}
    ${p.meal ? `<div class="meta"><span class="label">Meal note:</span> ${escapeHTML(p.meal)}</div>` : ""}
    ${p.mustOrder ? `<div class="must"><strong>Must order:</strong> ${escapeHTML(p.mustOrder)}</div>` : ""}
    <div class="actions">
      <a class="btn primary" href="${directions}" target="_blank" rel="noopener">Directions</a>
      ${p.website ? `<a class="btn secondary" href="${escapeHTML(p.website)}" target="_blank" rel="noopener">Website</a>` : ""}
    </div>
  </article>`;
}

function render() {
  const visible = places.filter(matches);
  document.getElementById("cards").innerHTML = visible.map(cardHTML).join("");
  document.getElementById("visibleCount").textContent = `${visible.length} shown`;
  markers.forEach(m => map.removeLayer(m));
  markers.length = 0;
  for (const p of visible) {
    const marker = markerByName.get(p._id);
    if (marker) { marker.addTo(map); markers.push(marker); }
  }
  if (markers.length) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(.12), {maxZoom:14});
  }
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById("chips").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.filter;
  render();
});

function loadFixedPins() {
  const statusEl = document.getElementById("mapStatus");
  let count = 0;
  for (const p of places) {
    const loc = fixedCoordinates[p.name];
    if (!loc) continue;
    const marker = L.marker(loc, {icon:pinIcon(p.category)});
    marker.bindPopup(`<div class="popup-name">${escapeHTML(p.name)}</div><div>${categoryNames[p.category]}</div>${p.rating ? `<div>${escapeHTML(p.rating)}</div>`:""}`);
    markerByName.set(p._id, marker);
    if (matches(p)) { marker.addTo(map); markers.push(marker); }
    count += 1;
  }
  if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(.12), {maxZoom:14});
  if (statusEl) statusEl.textContent = `${count} map pins loaded`;
}

render();
loadFixedPins();
</script>
