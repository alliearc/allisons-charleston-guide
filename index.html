<style>
:root{--cream:#fbf7f0;--paper:#fff;--ink:#2e3c34;--muted:#6e7b73;--sage:#718777;--gold:#c29a4a;--purple:#8d65a8;--coffee:#8a5d3b;--red:#a76565;--line:#ddd8cf}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{padding:26px 18px 18px;background:linear-gradient(135deg,#e8efe8,#fbf7f0);border-bottom:1px solid var(--line)}
h1{margin:0;font-family:Georgia,serif;font-weight:500;font-size:clamp(32px,6vw,54px)}
.subtitle{margin-top:7px;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:1000;padding:10px 12px;background:rgba(251,247,240,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.filters{display:flex;gap:7px;overflow:auto;padding:9px 0 1px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.statusline{font-size:12px;color:var(--muted);margin-top:7px}
.layout{display:grid;grid-template-columns:1.05fr .95fr;min-height:calc(100vh - 180px)}
.mapwrap{position:relative}
#map{height:calc(100vh - 180px);position:sticky;top:112px}
.legend{position:absolute;right:12px;bottom:12px;z-index:800;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px}
.legend div+div{margin-top:5px}
.list{padding:14px;display:grid;gap:12px;align-content:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 4px 14px rgba(46,60,52,.05)}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h2{font:500 23px Georgia,serif;margin:0}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;padding:5px 7px;border-radius:999px;background:#edf1eb;white-space:nowrap}
.badge.gold{background:#f3e6c4} .badge.purple{background:#eadff2} .badge.coffee{background:#eee1d8} .badge.red{background:#f4dddd}
.meta{font-size:13px;color:var(--muted);line-height:1.4;margin:6px 0 10px}
.desc{line-height:1.45}
.rating{font-size:17px;margin-top:9px}
.must{margin-top:10px;padding:10px;border-radius:10px;background:#f7f3ea;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{text-decoration:none;color:#fff;background:var(--sage);padding:10px 12px;border-radius:10px;font-size:14px;font-weight:650}
.btn.secondary{color:var(--ink);background:#fff;border:1px solid var(--line)}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:820px){.layout{display:block}#map{position:relative;top:0;height:43vh}.list{padding:11px}header{padding-top:20px}}
</style>
</head>

const filters=document.getElementById("filters"), list=document.getElementById("list"), statusEl=document.getElementById("status");
const map=L.map("map").setView([32.79,-79.95],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const markerLayer=L.layerGroup().addTo(map);
function mapsUrl(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+p.address)}
function wantsTry(p){return !p.visited && !p.skip}
function matches(p){
 const text=[p.name,p.address,p.locale,p.hood,p.hours,p.specialties,p.rating,p.must_order,p.category].join(" ").toLowerCase();
 let f=true;
 if(active==="Restaurants") f=p.category==="Restaurant";
 else if(active==="Favorites") f=p.favorite;
 else if(active==="Return Soon") f=p.returnSoon;
 else if(active==="Want to Try") f=wantsTry(p);
 else if(active==="Been There") f=p.visited;
 else if(active==="Bakeries & Dessert") f=p.category==="Bakery & Dessert";
 else if(active==="Coffee Shops") f=p.category==="Coffee Shop";
 else if(active==="Michelin") f=p.specialties.toLowerCase().includes("michelin");
 else if(active!=="All") f=(p.locale+" "+p.hood).toLowerCase().includes(active.toLowerCase());
 return f && (!query||text.includes(query));
}
function badges(p){
 let b=[];
 if(p.category==="Restaurant") b.push('<span class="badge">🍴 Restaurant</span>');
 if(p.category==="Bakery & Dessert") b.push('<span class="badge purple">🍰 Bakery & Dessert</span>');
 if(p.category==="Coffee Shop") b.push('<span class="badge coffee">☕ Coffee</span>');
 if(p.favorite) b.push('<span class="badge gold">⭐ Favorite</span>');
 if(p.returnSoon) b.push('<span class="badge gold">🔁 Return Soon</span>');
 if(p.visited) b.push('<span class="badge">✅ Been There</span>');
 if(p.skip) b.push('<span class="badge red">🚫 No Need to Return</span>');
 return b.join("");
}
function render(){
 const visible=places.filter(matches);
 list.innerHTML=visible.length?visible.map(p=>`
 <article class="card">
  <div class="cardhead"><h2>${p.name}</h2><div class="badges">${badges(p)}</div></div>
  <div class="meta">${p.locale}${p.hood?" • "+p.hood:""}<br>${p.address}<br>${p.hours}</div>
  <div class="desc"><strong>${p.specialties}</strong></div>
  ${p.rating?`<div class="rating">${p.rating}</div>`:""}
  ${p.must_order?`<div class="must"><strong>Must order:</strong> ${p.must_order}</div>`:""}
  <div class="actions"><a class="btn" target="_blank" href="${mapsUrl(p)}">Directions</a><a class="btn secondary" target="_blank" href="${p.website}">Website</a></div>
 </article>`).join(""):'<div class="empty">No places match that search or filter.</div>';
 drawMarkers(visible);
}
filterNames.forEach((f,i)=>{
 const b=document.createElement("button");b.className="chip"+(i===0?" on":"");b.textContent=f;
 b.onclick=()=>{active=f;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));render()};
 filters.appendChild(b);
});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
const cache=JSON.parse(localStorage.getItem("allisonCharlestonCoordsV2")||"{}");
async function geocode(p){
 if(cache[p.address]) return cache[p.address];
 const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q="+encodeURIComponent(p.address);
 const res=await fetch(url,{headers:{"Accept":"application/json"}});
 const j=await res.json();
 if(j[0]){cache[p.address]=[+j[0].lat,+j[0].lon];localStorage.setItem("allisonCharlestonCoordsV2",JSON.stringify(cache));return cache[p.address]}
 return null;
}
function markerIcon(p){
 if(p.category==="Bakery & Dessert") return L.divIcon({className:"",html:'<div style="width:29px;height:29px;border-radius:50%;background:#8d65a8;border:2px solid white;box-shadow:0 1px 5px #555;display:flex;align-items:center;justify-content:center;font-size:15px">🍰</div>',iconSize:[29,29],iconAnchor:[15,15]});
 if(p.category==="Coffee Shop") return L.divIcon({className:"",html:'<div style="width:29px;height:29px;border-radius:50%;background:#8a5d3b;border:2px solid white;box-shadow:0 1px 5px #555;display:flex;align-items:center;justify-content:center;font-size:15px">☕</div>',iconSize:[29,29],iconAnchor:[15,15]});
 if(p.favorite) return L.divIcon({className:"",html:'<div style="width:31px;height:31px;border-radius:50%;background:#c29a4a;border:2px solid white;box-shadow:0 1px 6px #555;display:flex;align-items:center;justify-content:center;font-size:17px">⭐</div>',iconSize:[31,31],iconAnchor:[16,16]});
 const color=p.skip?"#a76565":"#718777";
 return L.divIcon({className:"",html:`<div style="width:19px;height:19px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid white;box-shadow:0 1px 5px #555"></div>`,iconSize:[20,20],iconAnchor:[10,20]});
}
function drawMarkers(visible){
 markerLayer.clearLayers();const bounds=[];
 visible.forEach(p=>{if(!p.coords)return;
 L.marker(p.coords,{icon:markerIcon(p)}).bindPopup(`<b>${p.name}</b><br>${p.category}<br>${p.address}<br><a target="_blank" href="${mapsUrl(p)}">Directions</a> · <a target="_blank" href="${p.website}">Website</a>`).addTo(markerLayer);bounds.push(p.coords);
 });
 if(bounds.length>1) map.fitBounds(bounds,{padding:[25,25],maxZoom:15});
}
async function loadPins(){
 let loaded=0;
 const queue=places.filter(p=>!cache[p.address]);
 places.forEach(p=>{if(cache[p.address])p.coords=cache[p.address]});
 render();
 if(!queue.length){statusEl.textContent="Map ready.";return}
 for(let i=0;i<queue.length;i+=4){
  const batch=queue.slice(i,i+4);
  await Promise.all(batch.map(async p=>{try{p.coords=await geocode(p);loaded++}catch(e){}}));
  statusEl.textContent=`Loading new map pins… ${Math.min(i+4,queue.length)} of ${queue.length}`;
  render();
  await new Promise(r=>setTimeout(r,1150));
 }
 statusEl.textContent="Map ready. Pin locations are now saved on this device.";
 render();
}
render();loadPins();
</script>
</body>
</html>
